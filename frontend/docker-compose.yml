services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: /api/v1
        VITE_SITE_ID: ${SITE_ID:-home}
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: ping-monitor-api:latest
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped
