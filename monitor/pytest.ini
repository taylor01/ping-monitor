[pytest]
# Pytest configuration for ping monitor

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 8.0

# Add current directory to Python path
pythonpath = .

# Show extra test summary info
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=ping_monitor
    --cov-report=term-missing
    --cov-report=html
    --asyncio-mode=auto

# Mark async tests
markers =
    asyncio: mark test as async
    integration: mark test as integration test (may require external services)
    slow: mark test as slow running

# Test output
console_output_style = progress

# Coverage settings
[coverage:run]
source = ping_monitor
omit =
    */tests/*
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
