name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR and give a CLEAR VERDICT. Start your comment with:
            - **APPROVED** - Ready to merge, no blocking issues
            - **CHANGES REQUESTED** - Must be fixed before merging

            ONLY flag these issues:
            1. Security vulnerabilities (SQL injection, XSS, auth bypass, secrets exposure)
            2. Bugs that WILL cause failures (not hypothetical edge cases)
            3. Critical performance issues (N+1 queries, missing indexes on large tables)

            DO NOT comment on:
            - Style preferences or minor refactoring suggestions
            - Hypothetical edge cases that are unlikely in practice
            - Missing tests (unless for security-critical code)
            - Things that are already working correctly

            If the code works and has no security/critical issues, APPROVE IT.
            Keep feedback brief - max 3-5 bullet points if changes needed.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

