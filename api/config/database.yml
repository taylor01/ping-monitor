# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: storage/development.sqlite3
  queue:
    <<: *default
    database: storage/development_queue.sqlite3
    migrations_paths: db/queue_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3


# Production uses PostgreSQL via DATABASE_URL
# Database name is specified in the URL: postgresql://user:pass@host:port/ping_monitor_production
# All solid_* adapters share the same database (separate tables)
production:
  primary: &production_default
    adapter: postgresql
    encoding: unicode
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *production_default
    migrations_paths: db/cache_migrate
  queue:
    <<: *production_default
    migrations_paths: db/queue_migrate
  cable:
    <<: *production_default
    migrations_paths: db/cable_migrate
