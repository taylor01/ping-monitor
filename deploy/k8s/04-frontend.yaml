apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-monitor-frontend
  namespace: ping-monitor
  labels:
    app: ping-monitor-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ping-monitor-frontend
  template:
    metadata:
      labels:
        app: ping-monitor-frontend
    spec:
      containers:
        - name: frontend
          image: taylor01/ping-monitor-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ping-monitor-frontend
  namespace: ping-monitor
spec:
  selector:
    app: ping-monitor-frontend
  ports:
    - port: 80
      targetPort: 80
